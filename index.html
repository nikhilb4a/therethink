<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Re:think</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F2EDE4;
      --black: #1A1A18;
      --warm-gray: #C8BFB0;
      --green: #02391f;
      --orange: #ff6b35;
      --trans: 0.65s cubic-bezier(0.76, 0, 0.24, 1);
    }
    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--cream);
      color: var(--black);
      overflow: hidden;
    }

    /* ── INTRO ── */
    #intro {
      position: fixed; inset: 0;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-logo { text-align: center; animation: fadeUp 1s ease forwards; }
    .intro-logo img {
      width: clamp(180px, 28vw, 320px);
      height: auto;
      display: block;
      opacity: 0.88;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SPLIT ── */
    #split { display: flex; height: 100vh; width: 100vw; }

    .panel {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2.5rem, 5vw, 5.5rem) clamp(2rem, 5vw, 5rem);
      cursor: pointer;
      overflow: hidden;
      transition: flex var(--trans);
    }
    .panel::before {
      content: '';
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity var(--trans);
    }
    #panel-individual { border-right: 1px solid var(--warm-gray); }
    #panel-individual::before { background: var(--green); }
    #panel-business::before  { background: var(--orange); }

    .panel:hover { flex: 1.45; }
    .panel:hover::before { opacity: 1; }
    .panel:hover .panel-label   { color: rgba(255,255,255,0.55); }
    .panel:hover .panel-title   { color: white; }
    .panel:hover .panel-tag     { color: rgba(255,255,255,0.7); }
    .panel:hover .panel-tag::before { color: rgba(255,255,255,0.45); }
    .panel:hover .panel-cta     { background: var(--cream); border-color: var(--cream); color: var(--black); }
    .panel:hover .arrow         { opacity: 1; transform: translateX(0); }
    .panel:hover .panel-logo    { filter: invert(1); opacity: 0.95; }

    .panel-content { position: relative; z-index: 2; }

    .panel-logo {
      width: clamp(130px, 20vw, 220px);
      height: auto;
      margin-bottom: 2.8rem;
      display: block;
      opacity: 0.85;
      transition: filter var(--trans), opacity var(--trans);
    }
    .panel-label {
      font-size: 0.58rem; font-weight: 700; letter-spacing: 0.28em;
      text-transform: uppercase; color: #aaa; margin-bottom: 0.7rem;
      transition: color var(--trans);
    }
    .panel-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800; font-size: clamp(3rem, 6.5vw, 6.5rem);
      line-height: 0.95; letter-spacing: -0.035em;
      color: var(--black); transition: color var(--trans); margin-bottom: 2rem;
    }
    .panel-tags { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 2.8rem; }
    .panel-tag {
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: #999;
      display: flex; align-items: center; gap: 0.5rem;
      transition: color var(--trans);
    }
    .panel-tag::before {
      content: '+'; font-weight: 800; font-size: 0.8rem;
      color: #ccc; line-height: 1; transition: color var(--trans);
    }
    .panel-cta {
      display: inline-flex; align-items: center; gap: 0.8rem;
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--black);
      border: 1.5px solid rgba(0,0,0,0.25); padding: 0.85rem 1.75rem;
      transition: color var(--trans), border-color var(--trans), background var(--trans);
      width: fit-content; text-decoration: none;
    }
    .arrow {
      opacity: 0; transform: translateX(-6px);
      transition: opacity var(--trans), transform var(--trans);
    }

    /* Mobile */
    @media (max-width: 640px) {
      html, body { overflow: auto; }
      #split { flex-direction: column; height: auto; min-height: 100vh; }
      .panel { min-height: 50vh; border-right: none !important; border-bottom: 1px solid var(--warm-gray); }
      .panel:hover { flex: none; }
    }
  /* ============================================
   MOBILE OPTIMISATION — injected into all pages
   ============================================ */

/* ── HAMBURGER NAV ── */
.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 4px;
  background: none;
  border: none;
  z-index: 300;
}
.nav-hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--black);
  transition: all 0.3s ease;
  transform-origin: center;
}
.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-hamburger.open span:nth-child(2) { opacity: 0; }
.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile overlay menu */
.mobile-menu {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--black);
  z-index: 250;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.mobile-menu.open {
  opacity: 1;
}
.mobile-menu a {
  font-family: var(--font);
  font-size: clamp(1.5rem, 6vw, 2.5rem);
  font-weight: 800;
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  padding: 0.8rem 2rem;
  letter-spacing: -0.02em;
  transition: color 0.2s;
  text-align: center;
}
.mobile-menu a:hover, .mobile-menu a.active { color: var(--orange); }
.mobile-menu .mobile-close {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  font-size: 1.5rem;
  color: rgba(255,255,255,0.4);
  background: none;
  border: none;
  cursor: pointer;
  line-height: 1;
  transition: color 0.2s;
}
.mobile-menu .mobile-close:hover { color: white; }
.mobile-cta {
  margin-top: 1.5rem;
  font-family: var(--font) !important;
  font-size: 0.65rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.14em !important;
  text-transform: uppercase !important;
  padding: 0.9rem 2rem !important;
  background: var(--orange) !important;
  color: white !important;
  border-radius: 0 !important;
}

@media(max-width:768px) {
  /* Show hamburger */
  .nav-hamburger { display: flex; }
  /* Hide desktop nav links */
  .nav-links { display: none !important; }
  .nav-cta { display: none; }

  /* Flip cards — tap to flip on mobile */
  .flip-card.tapped .flip-inner,
  .ppp-card.tapped .ppp-inner { transform: rotateY(180deg); }

  /* Engagement words — make tappable */
  .ew { font-size: clamp(1.2rem,5vw,2rem); padding: 0.7rem 0; }

  /* Logo banner touch scroll */
  .lb-track-wrap { -webkit-overflow-scrolling: touch; }

  /* General padding tightening */
  .section, .wrap { padding: clamp(2.5rem,6vw,4rem) clamp(1.2rem,5vw,2rem); }
  .page-hero { padding: clamp(6rem,12vw,8rem) clamp(1.2rem,5vw,2rem) clamp(3rem,6vw,4rem); }

  /* Hero */
  #hero { min-height: auto; padding: clamp(5rem,10vw,7rem) clamp(1.2rem,5vw,2rem) clamp(3rem,5vw,4rem); }
  .hero-left { padding: 0; }
  .hero-h1 { font-size: clamp(2.2rem,8vw,3.5rem); }

  /* Who grid */
  .who-grid, .wg-card { border-right: none; }

  /* Approach 5 grid */
  .approach-grid { grid-template-columns: 1fr !important; }
  .ap-card:hover .ap-body, .disc-card:hover .dc-body { opacity: 1; max-height: 200px; }

  /* Flip card grid */
  .flip-grid { grid-template-columns: 1fr 1fr !important; gap: 0.8rem; }
  .flip-card { height: 200px; }
  .fc-title { font-size: 0.88rem; }

  /* PPP cards */
  .ppp-cards { grid-template-columns: 1fr !important; }
  .ppp-card { height: 260px; }

  /* Method grid */
  .method-grid { grid-template-columns: 1fr !important; }

  /* Stats */
  .stat-row { grid-template-columns: 1fr !important; }

  /* CTA strips */
  .cta-strip, .cta-banner { flex-direction: column; align-items: flex-start; gap: 1.5rem; }

  /* Footer */
  .footer-grid { grid-template-columns: 1fr !important; gap: 2rem; }

  /* Forms */
  .form-row, .contact-wrap { grid-template-columns: 1fr !important; }
  .contact-wrap { display: block !important; }
  .contact-left { min-height: auto; }

  /* Team */
  .leader-grid, .leader-grid.reverse { grid-template-columns: 1fr !important; }
  .leader-grid.reverse .leader-copy,
  .leader-grid.reverse .leader-photo-wrap { order: unset !important; }
  .leader-photo-wrap { position: relative !important; top: auto !important; }
  .leader-photo { aspect-ratio: 3/2; }

  /* Research intro */
  .research-intro, .research-grid, .ppp-intro-grid,
  .method-intro, .problem-grid, .services-grid,
  .flagship-grid, .models-grid { grid-template-columns: 1fr !important; }

  /* FAQ */
  .faq-q { font-size: 0.82rem; }
}

@media(max-width:480px) {
  .flip-grid { grid-template-columns: 1fr !important; }
  .flip-card { height: 180px; }
  .who-grid { grid-template-columns: 1fr; }
  .disc-grid { grid-template-columns: 1fr !important; }
}

@media(max-width:640px) {
  #split { flex-direction: column; height: auto; min-height: 100vh; }
  .panel { min-height: 50vh; border-right: none !important; border-bottom: 1px solid var(--warm-gray); flex: none !important; }
  .panel-title { font-size: clamp(2.5rem,10vw,4rem); }
  .panel-logo { width: clamp(110px,35vw,180px); margin-bottom: 1.5rem; }
  .panel-cta { font-size: 0.55rem; padding: 0.75rem 1.4rem; }
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-logo">
    <img src="logo-rethink.png" alt="The Re:think"/>
  </div>
</div>

<!-- SPLIT -->
<div id="split">

  <!-- LEFT: Individual -->
  <div class="panel" id="panel-individual" onclick="window.location='https://www.therethink.com'">
    <div class="panel-content">
      <img src="logo-rethink.png" alt="The Re:think" class="panel-logo"/>
      <div class="panel-label">For you</div>
      <div class="panel-title">individual.</div>
      <div class="panel-tags">
        <span class="panel-tag">Personal Development</span>
        <span class="panel-tag">Parenting</span>
        <span class="panel-tag">Relationships</span>
      </div>
      <a class="panel-cta">Explore The Re:think <span class="arrow">→</span></a>
    </div>
  </div>

  <!-- RIGHT: Business -->
  <div class="panel" id="panel-business" onclick="window.location='rethink-lab.html'">
    <div class="panel-content">
      <img src="logo-rethink-lab.png" alt="The Re:think Lab" class="panel-logo"/>
      <div class="panel-label">For your organization</div>
      <div class="panel-title">business.</div>
      <div class="panel-tags">
        <span class="panel-tag">Corporate</span>
        <span class="panel-tag">Family Office</span>
        <span class="panel-tag">Startup / Entrepreneur</span>
      </div>
      <a class="panel-cta">Explore Re:think Lab <span class="arrow">→</span></a>
    </div>
  </div>

</div>

<script>
  setTimeout(() => document.getElementById('intro').classList.add('hidden'), 1800);
</script>
</body>
</html>
